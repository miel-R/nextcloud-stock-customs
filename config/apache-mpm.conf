# Apache MPM tuning for ~400 Nextcloud users (mod_php / mpm_prefork).
#
# Rule of thumb: the worker count must fit inside the container memory limit.
#   - container memory limit = 8G (see compose.yaml)
#   - average PHP request (mod_php) ~ 120-160 MB
#   - MaxRequestWorkers ~= 8G / 150MB ~= 50-60  -> use 60, keep headroom
# A big worker count (e.g. 150) with memory_limit 512M will OOM the container
# under sustained load. If you need more concurrency, switch the web tier to
# the `nextcloud` fpm image + php-fpm pm.max_children instead.
<IfModule mpm_prefork_module>
    ServerLimit             60
    StartServers             4
    MinSpareServers          5
    MaxSpareServers         15
    MaxRequestWorkers       60
    MaxConnectionsPerChild 2000
</IfModule>

# KeepAlive for better connection reuse
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Compression - reduces bandwidth for 400 users
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml
    AddOutputFilterByType DEFLATE text/css text/javascript application/javascript
    AddOutputFilterByType DEFLATE application/json application/xml
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# Browser caching for static assets
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/jpg "access plus 1 month"
    ExpiresByType image/jpeg "access plus 1 month"
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType image/gif "access plus 1 month"
    ExpiresByType image/svg+xml "access plus 1 month"
    ExpiresByType image/x-icon "access plus 1 month"
    ExpiresByType text/css "access plus 1 week"
    ExpiresByType text/javascript "access plus 1 week"
    ExpiresByType application/javascript "access plus 1 week"
    ExpiresByType application/json "access plus 1 week"
    ExpiresByType application/font-woff2 "access plus 1 month"
</IfModule>

# Security headers (Caddy already adds the main ones)
<IfModule mod_headers.c>
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    Header set X-Content-Type-Options "nosniff"
</IfModule>