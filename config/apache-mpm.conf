# Apache MPM tuning (mpm_prefork, mod_php).
#
# Worker counts are env-driven: Apache expands ${VAR} from the container
# environment when it reads this file. Set APP_MAX_WORKERS in .env so the
# process count always matches the APP_MEM_LIMIT you gave the app container.
#
# Rule of thumb: total workers x ~150 MB must fit the container memory limit.
#   - 8 GB container /   60 workers  (~9 GB if all busy is too many - OOM risk)
#   - 8 GB container /   ~50 workers  (classic 400-user sizing)
#   - 3 GB container /   ~16 workers  (small 8 GB host with Talk)
#   - 2 GB container /   ~10 workers
# Use `docker exec nextcloud-app sh -c 'cat /proc/$PID/status | grep ^VmRSS'`
# on a busy worker to calibrate the ~150 MB estimate for your workloads.
# For real concurrency with tight RAM, switch the web tier to the fpm image
# (`nextcloud:fpm`) + pm.max_children instead of prefork.
<IfModule mpm_prefork_module>
    ServerLimit             ${APP_MAX_WORKERS:-16}
    StartServers            ${APP_START_SERVERS:-2}
    MinSpareServers         ${APP_MIN_SPARE:-2}
    MaxSpareServers         ${APP_MAX_SPARE:-4}
    MaxRequestWorkers       ${APP_MAX_WORKERS:-16}
    MaxConnectionsPerChild 2000
</IfModule>

# KeepAlive for better connection reuse
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# Compression - reduces bandwidth for 400 users
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/xml
    AddOutputFilterByType DEFLATE text/css text/javascript application/javascript
    AddOutputFilterByType DEFLATE application/json application/xml
    AddOutputFilterByType DEFLATE image/svg+xml
</IfModule>

# Browser caching for static assets
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType image/jpg "access plus 1 month"
    ExpiresByType image/jpeg "access plus 1 month"
    ExpiresByType image/png "access plus 1 month"
    ExpiresByType image/gif "access plus 1 month"
    ExpiresByType image/svg+xml "access plus 1 month"
    ExpiresByType image/x-icon "access plus 1 month"
    ExpiresByType text/css "access plus 1 week"
    ExpiresByType text/javascript "access plus 1 week"
    ExpiresByType application/javascript "access plus 1 week"
    ExpiresByType application/json "access plus 1 week"
    ExpiresByType application/font-woff2 "access plus 1 month"
</IfModule>

# Security headers (Caddy already adds the main ones)
<IfModule mod_headers.c>
    Header set Referrer-Policy "strict-origin-when-cross-origin"
    Header set X-Content-Type-Options "nosniff"
</IfModule>