# PostgreSQL client authentication (mounted into compose.db.yaml). We mount
# this explicitly because POSTGRES_HOST connections come from the Docker
# network (the Nextcloud app container), and the stock default pg_hba.conf
# only trusts localhost - which would reject the app with
# "no pg_hba.conf entry for host ...".
# Modes: trust / scram-sha-256. The Nextcloud app authenticates with the
# POSTGRES_PASSWORD (scram), matching the role password set by the image.
# Default snapshot of the official postgres image's pg_hba.conf with the
# network rule added (replace 172.16.0.0/12 with your nextcloud-network
# subnet if it differs).

local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             172.16.0.0/12           scram-sha-256

# Replication from localhost is only needed for HA setups.
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
