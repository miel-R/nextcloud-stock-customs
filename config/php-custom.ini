; PHP tuning, right-sized for a small-to-medium host (env-driven sizing, see
; SCALING.md). Mounted as conf.d/zz-custom.ini (see compose.yaml) so these
; values load AFTER the image's nextcloud.ini / opcache-recommended.ini and
; really take effect.
;
; NOTE: php.ini cannot expand environment variables, so set UPLOAD_MAX_SIZE (php
; uploads) AND the nginx client_max_body_size together in .env / config/nginx.conf.
; Keep the upload_*/post_max_size values here in sync with UPLOAD_MAX_SIZE
; (default 2G) and the nginx client_max_body_size >= it.
memory_limit = 512M
upload_max_filesize = 2G
post_max_size = 2G
max_execution_time = 3600
max_input_time = 3600
max_file_uploads = 100
default_socket_timeout = 60

; OPcache - required for Nextcloud performance. interned_strings_buffer must be
; > 8 (Nextcloud recommends 16) or the "OPcache interned strings buffer nearly
; full" admin warning appears.
opcache.enable=1
opcache.enable_cli=1
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.memory_consumption=128
opcache.save_comments=1
opcache.revalidate_freq=60
opcache.fast_shutdown=1

; APCu - local cache for Nextcloud (distributed cache/locking go to Redis)
apc.enabled=1
apc.enable_cli=1
apc.shm_size=64M
apc.ttl=7200
apc.gc_ttl=3600
apc.entries_hint=10000
apc.write_lock=1

; Realpath cache - reduces filesystem stat calls
realpath_cache_size=4096K
realpath_cache_ttl=600
