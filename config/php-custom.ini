; PHP tuning for a ~400-user Nextcloud.
; Mounted as conf.d/zz-custom.ini (see compose.yaml) so that these values are
; loaded AFTER the image's nextcloud.ini / opcache-recommended.ini and really
; take effect. The image's APACHE_BODY_LIMIT default is 1G, so compose.yaml
; raises it to 10G to match upload_max_filesize here.
memory_limit = 512M
upload_max_filesize = 10G
post_max_size = 10G
max_execution_time = 3600
max_input_time = 3600
max_file_uploads = 100
default_socket_timeout = 60

; OPcache - required for Nextcloud performance
opcache.enable=1
opcache.enable_cli=1
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.memory_consumption=512
opcache.save_comments=1
opcache.revalidate_freq=60
opcache.fast_shutdown=1

; APCu - local cache for Nextcloud (distributed cache/locking go to Redis)
apc.enabled=1
apc.enable_cli=1
apc.shm_size=128M
apc.ttl=7200
apc.gc_ttl=3600
apc.entries_hint=10000
apc.write_lock=1

; Realpath cache - reduces filesystem stat calls
realpath_cache_size=4096K
realpath_cache_ttl=600
