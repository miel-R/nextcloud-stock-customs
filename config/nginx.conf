# Nginx reverse proxy for the Nextcloud PHP-FPM tier (AIO-style, stock images).
# This is the `nextcloud-nginx` sidecar: it fronts the PHP-FPM container and is
# what Caddy proxies to on :80.
#
# - proxies PHP to the `nextcloud-app` FPM container on :9000
# - serves static files directly from the shared webroot volume (fast)
# - client_max_body_size <-> upload max: keep in sync with UPLOAD_MAX_SIZE in
#   .env and upload_/post_max_size in config/php-custom.ini. nginx uses M/G
#   suffixes, so this is hardcoded here (2G default) - see INSTALL.md.
# - listen :80 (no TLS here: Caddy/Tailscale handles the public edge)

upstream php-handler {
    server nextcloud-app:9000;
    keepalive 32;
}

# n8n on its own subdomain - same shared nginx, reverse-proxied by Host header.
# n8n is served at its OWN root (subpath hosting is broken: n8n-io/n8n#19635),
# so route it by a real hostname, not a /n8n/ subpath.
# Replace n8n.example.com with your real subdomain. Keep n8n on the internal
# network only (see compose.n8n.yaml proxied mode) so it is not on the host.
server {
    listen 80;
    server_name n8n.example.com;

    # n8n uploads are usually small; keep well below Nextcloud's 2G cap.
    client_max_body_size 20m;

    location / {
        proxy_pass         http://n8n_email_summarizer:5678;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # WebSocket support (n8n editor real-time push):
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Document root = the shared Nextcloud webroot volume (mounted :ro in nginx).
    root /var/www/html;

    # Serve .mjs (ES modules) with the JavaScript MIME type, or browsers refuse
    # to execute them (breaks some apps).
    types {
        text/html html htm shtml;
        text/css css;
        text/xml xml;
        image/gif gif;
        image/jpeg jpeg jpg;
        application/javascript js mjs;
        application/json json;
        application/wasm wasm;
        image/svg+xml svg svgz;
        image/png png;
        image/x-icon ico;
        image/webp webp;
        image/avif avif;
        font/woff woff;
        font/woff2 woff2;
        font/ttf ttf;
        font/otf otf;
        application/vnd.ms-fontobject eot;
        audio/mpeg mp3;
        audio/ogg oga ogg;
        video/mp4 mp4;
        video/webm webm;
        video/ogg ogv;
        application/ogg ogx;
        text/plain txt;
        application/pdf pdf;
        application/zip zip;
        application/gzip gz;
        application/x-7z-compressed 7z;
        application/rtf rtf;
    }

    # Hard-coded to match UPLOAD_MAX_SIZE (2G) - see config/php-custom.ini.
    client_max_body_size 2G;
    client_body_timeout 3600s;
    client_body_buffer_size 16k;
    fastcgi_buffers 64 4K;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Nextcloud-admin-recommended safe headers
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Download-Options "noopen" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/xml+rss application/image/svg+xml image/svg+xml;

    # Rewrite rules that Nextcloud ships.
    rewrite ^/core/s.gif /index.php?core/s.gif last;

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
    location = /.well-known/carddav {
        return 301 /remote.php/dav/;
    }
    location = /.well-known/caldav {
        return 301 /remote.php/dav/;
    }
    location /.well-known/acme-challenge {
        try_files $uri $uri/ =404;
    }
    location /.well-known/pki-validation {
        try_files $uri $uri/ =404;
    }
    # Everything else under /.well-known (e.g. webfinger, nodeinfo) goes to the
    # app so the OCS / WebFinger discovery works.
    location ^~ /.well-known {
        return 301 /index.php$request_uri;
    }

    # OCS provider discovery endpoints - delivered directly so clients/NEXTCLOUD
    # can resolve them (nextcloud's shipped nginx rules require these).
    location ^~ /ocm-provider/ {
        try_files $uri $uri/ /index.php$request_uri;
    }
    location ^~ /ocs-provider/ {
        try_files $uri $uri/ /index.php$request_uri;
    }

    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)/ {
        deny all;
    }
    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) {
        deny all;
    }

    # Front-controller: route clean URLs (no .php) to Nextcloud's index.php.
    # Nextcloud uses pretty URLs like /login, /apps/files, /settings - without
    # this catch-all those return 404 and the web UI won't render.
    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }

    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;
        fastcgi_param modHeadersAvailable true;
        fastcgi_pass php-handler;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
        fastcgi_keep_conn on;
    }

    location ~ \.(?:css|js|woff2?|svg|gif|png|jpg|jpeg|webp|ico|otf|ttf|eot|mp4|mp3|webm|flac|ogg|wav|swf)$ {
        try_files $uri /index.php$request_uri;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ ^/(?:status\.php|index\.php)$ {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;
        fastcgi_param modHeadersAvailable true;
        fastcgi_pass php-handler;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
        fastcgi_keep_conn on;
    }
}
