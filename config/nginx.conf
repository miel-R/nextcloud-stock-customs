# Nginx reverse proxy for the Nextcloud PHP-FPM tier (AIO-style, stock images).
# This is the `nextcloud-nginx` sidecar: it fronts the PHP-FPM container and is
# what Caddy proxies to on :80.
#
# - proxies PHP to the `nextcloud-app` FPM container on :9000
# - serves static files directly from the shared webroot volume (fast)
# - client_max_body_size <-> upload max: keep in sync with UPLOAD_MAX_SIZE in
#   .env and upload_/post_max_size in config/php-custom.ini. nginx uses M/G
#   suffixes, so this is hardcoded here (2G default) - see INSTALL.md.
# - listen :80 (no TLS here: Caddy/Tailscale handles the public edge)

upstream php-handler {
    server nextcloud-app:9000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Document root = the shared Nextcloud webroot volume (mounted :ro in nginx).
    root /var/www/html;

    # Hard-coded to match UPLOAD_MAX_SIZE (2G) - see config/php-custom.ini.
    client_max_body_size 2G;
    client_body_timeout 3600s;
    client_body_buffer_size 16k;
    fastcgi_buffers 64 4K;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/xml+rss application/image/svg+xml image/svg+xml;

    # Rewrite rules that Nextcloud ships.
    rewrite ^/.well-known/host-meta /public.php?service=host-meta last;
    rewrite ^/.well-known/host-meta.json /public.php?service=host-meta-json last;
    rewrite ^/.well-known/carddav /remote.php/dav/ last;
    rewrite ^/.well-known/caldav /remote.php/dav/ last;
    rewrite ^/.well-known/webfinger /public.php?service=webfinger last;
    rewrite ^/.well-known/nodeinfo /public.php?service=nodeinfo last;
    rewrite ^/core/s.gif /index.php?core/s.gif last;

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
    location = /.well-known/acme-challenge {
        return 404;
    }

    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)/ {
        deny all;
    }
    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) {
        deny all;
    }

    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;
        fastcgi_param modHeadersAvailable true;
        fastcgi_pass php-handler;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
        fastcgi_keep_conn on;
    }

    location ~ \.(?:css|js|woff2?|svg|gif|png|jpg|jpeg|webp|ico|otf|ttf|eot|mp4|mp3|webm|flac|ogg|wav|swf)$ {
        try_files $uri /index.php$request_uri;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location ~ ^/(?:status\.php|index\.php)$ {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_param HTTPS on;
        fastcgi_param modHeadersAvailable true;
        fastcgi_pass php-handler;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
        fastcgi_keep_conn on;
    }
}
