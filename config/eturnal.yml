# eturnal STUN/TURN server configuration (read-only mount into the `turn`
# container: ./config/eturnal.yml -> /etc/eturnal.yml).
#
# This only configures the listeners; the shared secret comes from the
# ETURNAL_SECRET environment variable in compose.yaml, which reads
# .env -> TURN_SECRET. See https://eturnal.net/doc/ for all options.

eturnal:
  # STUN/TURN (non-TLS) on the standard port
  listen:
    - ip: "::"
      port: 3478
      transport: udp
    - ip: "::"
      port: 3478
      transport: tcp

  log_dir: stdout
  log_level: info

  # Relay (media) port range used by eturnal per-session. Keep this in sync
  # with the range published by compose.turn.yaml (TURN_RELAY_PORTS, default
  # 48000-48200). These host ports must be open in the firewall for clients to
  # relay through TURN. The main compose.yaml does NOT publish this range - it
  # is only started via `docker compose -f compose.yaml -f compose.turn.yaml`.
  relay_min_port: 48000
  relay_max_port: 48200

  # The relay address is auto-detected via STUN at startup. If the host is
  # behind CGNAT/port-forwarding, set ETURNAL_RELAY_IPV4_ADDR in the `turn`
  # service's environment (compose.yaml) to this host's public IPv4 address.