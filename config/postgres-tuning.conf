# PostgreSQL tuning for a ~400-user Nextcloud instance.
# Container memory limit is 4G (see compose.yaml), so shared_buffers + the
# worst-case work_mem must stay within budget.
shared_buffers = 1GB
effective_cache_size = 3GB
work_mem = 16MB
maintenance_work_mem = 512MB
# Roughly one DB connection per Apache worker + spare room for cron/occ.
max_connections = 150
synchronous_commit = off
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100

# WAL and checkpoint tuning - prevent checkpoint storms under sustained load
max_wal_size = 2GB
min_wal_size = 1GB
wal_writer_delay = 200ms
wal_writer_flush_after = 16MB

# Query planner (SSD-friendly values)
random_page_cost = 1.1
seq_page_cost = 1.0