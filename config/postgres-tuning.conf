# PostgreSQL planner + WAL tuning (static part). Memory/work knobs are passed
# on the command line in compose.db.yaml so they can be set from .env:
#   DB_SHARED_BUFFERS, DB_EFFECTIVE_CACHE_SIZE, DB_WORK_MEM,
#   DB_MAINT_WORK_MEM, DB_MAX_CONNECTIONS, DB_MAX_WAL_SIZE, DB_MIN_WAL_SIZE
# (see SCALING.md / .env.example for presets).

# CRITICAL: this file replaces the stock postgresql.conf entirely, so the image
# defaults are gone. The official image sets listen_addresses via an override
# that is lost here - without this line Postgres binds to localhost only and the
# Nextcloud app gets "Connection refused" (so the app can never create the DB).
# Keep it: '*' = accept connections on the Docker network interface.
listen_addresses = '*'
port = 5432

synchronous_commit = off
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100

# WAL writer pacing - prevents checkpoint storms under sustained load
wal_writer_delay = 200ms
wal_writer_flush_after = 16MB

# Query planner (SSD-friendly values)
random_page_cost = 1.1
seq_page_cost = 1.0