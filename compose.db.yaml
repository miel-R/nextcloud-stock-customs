name: db-services

# ============================================================================
# Standalone stateful services + the shared reverse proxy.
#   - PostgreSQL + Redis (shared by ALL replicas of the app stack = compose.yaml)
#   - nextcloud-nginx (the single reverse proxy fronting the Nextcloud PHP tier)
#
# WHY a separate project:
#   - the app tier scales up/down freely: docker compose up -d --scale nextcloud-app=3
#   - the database is a SINGLE shared instance - it must never be scaled, and
#     scaling the app tier can never create a second Postgres.
#   - nginx is a SINGLETON (never scaled) - it lives with the other singletons.
#   - `docker compose down` (app stack) never stops the database, Redis or nginx.
#   - backups/upgrades of stateful services are isolated from the web tier.
#
# Start this FIRST, then the app stack:
#     docker compose -f compose.db.yaml up -d
#     docker compose up -d
#
# The app connects over the shared external network `nt_n8n_network`.
# Data volume `db-services` persists across both projects.
# Start/stop and the managed-cloud migration path: see DATABASE.md
# ============================================================================

# Sizing is env-driven (see SCALING.md). Defaults fit a small 8 GB host with
# Talk; the standard 400-user preset is documented in .env.example.
# ============================================================================

services:
  # ------------------------------------------------------------
  # POSTGRESQL DATABASE (singleton - never scale this service)
  # ------------------------------------------------------------
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    restart: unless-stopped
    volumes:
      - db:/var/lib/postgresql/data
      - ./config/postgres-tuning.conf:/etc/postgresql/postgresql.conf:ro
      # Explicit pg_hba.conf so the app container can connect over the Docker
      # network (stock default only trusts localhost -> "connection refused").
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # One-time provisioning of the shared n8n database/role that live in the
      # SAME Postgres instance. Runs only on first init of an empty data volume.
      # The n8n app itself runs in its OWN project (compose.n8n.yaml).
      - ./config/init-n8n.sh:/docker-entrypoint-initdb.d/init-n8n.sh:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      # Database/role created by init-n8n.sh for n8n (same instance, separate
      # DB). The n8n role reuses POSTGRES_PASSWORD by default (see init-n8n.sh).
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
      N8N_DB_USER: ${N8N_DB_USER:-n8n}
    # Memory/work knobs are passed on the command line so they can be set from
    # .env; the mounted postgresql.conf keeps the WAL + planner tuning, and the
    # mounted pg_hba.conf is pointed to via hba_file.
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c shared_buffers=${DB_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-1GB}
      -c work_mem=${DB_WORK_MEM:-8MB}
      -c maintenance_work_mem=${DB_MAINT_WORK_MEM:-128MB}
      -c max_connections=${DB_MAX_CONNECTIONS:-60}
      -c max_wal_size=${DB_MAX_WAL_SIZE:-1GB}
      -c min_wal_size=${DB_MIN_WAL_SIZE:-512MB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextcloud} -d ${POSTGRES_DB:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nt_n8n_network
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-2G}
          cpus: '${DB_CPUS_LIMIT:-1}'
        reservations:
          memory: ${DB_MEM_RES:-1G}
          cpus: '${DB_CPUS_RES:-1}'

  # ------------------------------------------------------------
  # REDIS (shared sessions / cache / file locking - singleton)
  # ------------------------------------------------------------
  nextcloud-redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    # allkeys-lru: evict least-recently-used keys instead of failing when full.
    # Keep maxmemory below the container limit. Size via REDIS_MAXMEMORY.
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nt_n8n_network
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-512M}
          cpus: "${REDIS_CPUS_LIMIT:-1}"
        reservations:
          memory: ${REDIS_MEM_RES:-256M}
          cpus: "${REDIS_CPUS_RES:-0.5}"

  # ------------------------------------------------------------
  # NGINX reverse proxy - shared sidecar fronting the Nextcloud PHP-FPM tier.
  #     Lives in db-services so the single nginx/singleton pattern is kept
  #     alongside the other singletons (postgres-db, nextcloud-redis).
  #     Serves static files from the shared webroot and proxies PHP to
  #     nextcloud-app:9000. Caddy proxies to this on :80.
  #     NOTE: nginx serves Nextcloud ONLY. n8n does NOT route through it.
  # ------------------------------------------------------------
  nextcloud-nginx:
    image: nginx:1.27-alpine
    container_name: nextcloud-nginx
    restart: unless-stopped
    volumes:
      - nextcloud:/var/www/html:ro
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/status.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - nt_n8n_network
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          memory: ${NGINX_MEM_LIMIT:-256M}
          cpus: "${NGINX_CPUS_LIMIT:-1}"
        reservations:
          memory: ${NGINX_MEM_RES:-128M}
          cpus: "${NGINX_CPUS_RES:-0.5}"

networks:
  nt_n8n_network:
    external: true
    name: nt_n8n_network

volumes:
  db:
    name: db-services
  nextcloud:
    name: nextcloud_www
