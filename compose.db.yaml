name: nextcloud-database

# ============================================================================
# Standalone stateful services (PostgreSQL + Redis) shared by ALL replicas of
# the app stack (compose.yaml).
#
# WHY a separate project:
#   - the app tier scales up/down freely: docker compose up -d --scale nextcloud-app=3
#   - the database is a SINGLE shared instance - it must never be scaled, and
#     scaling the app tier can never create a second Postgres.
#   - `docker compose down` (app stack) never stops the database or Redis.
#   - backups/upgrades of stateful services are isolated from the web tier.
#
# Start this FIRST, then the app stack:
#     docker compose -f compose.db.yaml up -d
#     docker compose up -d
#
# The app connects over the shared external network `nextcloud-network`.
# Data volume `nextcloud_db` persists across both projects.
# Start/stop and the managed-cloud migration path: see DATABASE.md
# ============================================================================

# Sizing is env-driven (see SCALING.md). Defaults fit a small 8 GB host with
# Talk; the standard 400-user preset is documented in .env.example.
# ============================================================================

services:
  # ------------------------------------------------------------
  # POSTGRESQL DATABASE (singleton - never scale this service)
  # ------------------------------------------------------------
  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    volumes:
      - db:/var/lib/postgresql/data
      - ./config/postgres-tuning.conf:/etc/postgresql/postgresql.conf:ro
      # Explicit pg_hba.conf so the app container can connect over the Docker
      # network (stock default only trusts localhost -> "connection refused").
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      # One-time provisioning of shared databases (e.g. n8n) that live in the
      # SAME Postgres instance. Runs only on first init of an empty data volume.
      - ./config/init-n8n.sh:/docker-entrypoint-initdb.d/init-n8n.sh:ro
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      # Database/role created by init-n8n.sh for n8n (same instance, separate DB).
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
      N8N_DB_USER: ${N8N_DB_USER:-n8n}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-}
    # Memory/work knobs are passed on the command line so they can be set from
    # .env; the mounted postgresql.conf keeps the WAL + planner tuning, and the
    # mounted pg_hba.conf is pointed to via hba_file.
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c shared_buffers=${DB_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${DB_EFFECTIVE_CACHE_SIZE:-1GB}
      -c work_mem=${DB_WORK_MEM:-8MB}
      -c maintenance_work_mem=${DB_MAINT_WORK_MEM:-128MB}
      -c max_connections=${DB_MAX_CONNECTIONS:-60}
      -c max_wal_size=${DB_MAX_WAL_SIZE:-1GB}
      -c min_wal_size=${DB_MIN_WAL_SIZE:-512MB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextcloud} -d ${POSTGRES_DB:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nextcloud-network
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-2G}
          cpus: '${DB_CPUS_LIMIT:-1}'
        reservations:
          memory: ${DB_MEM_RES:-1G}
          cpus: '${DB_CPUS_RES:-1}'

  # ------------------------------------------------------------
  # REDIS (shared sessions / cache / file locking - singleton)
  # ------------------------------------------------------------
  nextcloud-redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    # allkeys-lru: evict least-recently-used keys instead of failing when full.
    # Keep maxmemory below the container limit. Size via REDIS_MAXMEMORY.
    command: redis-server --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nextcloud-network
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-512M}
          cpus: "${REDIS_CPUS_LIMIT:-1}"
        reservations:
          memory: ${REDIS_MEM_RES:-256M}
          cpus: "${REDIS_CPUS_RES:-0.5}"

# ------------------------------------------------------------
# N8N (optional - COMMENTED OUT by default). Workflow automation that uses the
# SAME Postgres instance as Nextcloud (separate n8n database + role) and is
# reachable on the host loopback only (Tailscale direct / tailnet, NOT the
# Funnel hostname; n8n subpath hosting is broken in recent n8n - GitHub
# n8n-io/n8n#19635).
#
# To enable: uncomment this service AND set N8N_DB_PASSWORD in .env (see the
# commented line next to POSTGRES_PASSWORD), then:
#     docker compose -f compose.db.yaml up -d n8n
# config/init-n8n.sh provisions the n8n role + db on a fresh volume; on an
# existing volume create them manually (see N8N.md).
#
#  n8n:
#    image: docker.n8n.io/n8nio/n8n:latest
#    container_name: n8n_email_summarizer
#    restart: unless-stopped
#    # Loopback only - not exposed to the Funnel / internet.
#    ports:
#      - "127.0.0.1:5678:5678"
#    environment:
#      - GENERIC_TIMEZONE=Asia/Manila
#      - NODE_ENV=production
#      # WebSocket push for the editor (newer n8n prefers this over sse).
#      - N8N_PUSH_BACKEND=websocket
#      # --- database: SAME Postgres instance, separate DB/user ---
#      - DB_TYPE=postgresdb
#      - DB_POSTGRESDB_HOST=nextcloud-db
#      - DB_POSTGRESDB_PORT=5432
#      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
#      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
#      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
#      - DB_POSTGRESDB_SCHEMA=public
#    volumes:
#      - ./n8n_data:/home/node/.n8n
#    networks:
#      - nextcloud-network

# ------------------------------------------------------------
networks:
  nextcloud-network:
    external: true
    name: nextcloud-network

volumes:
  db:
    name: nextcloud_db
