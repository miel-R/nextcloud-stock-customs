name: nextcloud-stack

# ============================================================================
# Nextcloud stack sized for ~400 users
# ----------------------------------------------------------------------------
# Services (stateless web tier):
#   nextcloud-app     Nextcloud Apache + PHP (scalable: --scale)
#   nextcloud-cron    Background jobs (official /cron.sh)
#   signaling        Standalone Talk signaling server (stock, optional)
#   turn             STUN/TURN relay for Talk (stock, optional)
#   caddy             Reverse proxy (HTTP :80 here; TLS via Tailscale funnel)
#
# Stateful services (PostgreSQL + Redis) live in a SEPARATE project so the app
# tier can scale up/down without ever touching or duplicating them:
#     docker compose -f compose.db.yaml up -d        (see DATABASE.md)
#
# SCALING (see SCALING.md):
#   nextcloud-app is stateless on purpose:
#     - PHP sessions        -> Redis  (image wires this up from REDIS_HOST)
#     - distributed cache   -> Redis  (memcache.distributed)
#     - file locking        -> Redis  (memcache.locking)
#     - local cache         -> APCu   (built into the image)
#     - webroot             -> shared named volume `nextcloud`
#     - database            -> single shared PostgreSQL (compose.db.yaml)
#   To run more than one app instance with Compose on one host:
#     docker compose up -d --scale nextcloud-app=3
#   Docker's embedded DNS round-robins the `nextcloud-app` name across the
#   replicas, so Caddy load-balances without any Caddyfile change.
#   NOTE: `container_name` is intentionally NOT set on nextcloud-app because a
#   fixed container name prevents `--scale`. True elastic autoscaling requires
#   orchestration (Swarm/Kubernetes); deploy.replicas is honored there.
#
# SIZING (see SCALING.md) is env-driven - no hardcoded sizes here:
#   - memory/CPU limits/reservations come from ONE_* vars in .env
#   - replica floor defaults to 1 (APP_REPLICAS) and is the minimum on any host
#   - Apache worker count follows APP_MAX_WORKERS (Apache expands ${VAR} from
#     the container environment when loading config/apache-mpm.conf)
#   - the upload ceiling follows UPLOAD_MAX_SIZE (matches php-custom.ini)
#   Copy the matching preset block from .env.example into .env and restart.
# ============================================================================

services:
  # ------------------------------------------------------------
  # 1. MAIN NEXTCLOUD APP (scalable, no host ports)
  # ------------------------------------------------------------
  nextcloud-app:
    image: nextcloud:stable
    # NO container_name on purpose: allows `docker compose up -d --scale nextcloud-app=N`
    # (a fixed container_name conflicts with --scale).
    restart: unless-stopped
    volumes:
      - nextcloud:/var/www/html
      - ./config/apache-mpm.conf:/etc/apache2/conf-enabled/zz-mpm-tuning.conf:ro
      # zz- prefix on purpose: PHP loads conf.d files alphabetically and the
      # image's nextcloud.ini / opcache-recommended.ini would otherwise override
      # our values silently.
      - ./config/php-custom.ini:/usr/local/etc/php/conf.d/zz-custom.ini:ro
    environment:
      POSTGRES_HOST: nextcloud-db
      REDIS_HOST: nextcloud-redis
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?err}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      OVERWRITECLIURL: ${OVERWRITECLIURL:-http://localhost}
      OVERWRITEPROTOCOL: ${OVERWRITEPROTOCOL:-http}
      # Space-separated subnet(s) of reverse proxies (Caddy) in front of us.
      # Must match the docker network subnet.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Apache request body limit - must be >= upload_max_filesize in zz-custom.ini.
      # Apache's LimitRequestBody accepts BYTES only (no G/M suffix). Keep in
      # sync with UPLOAD_MAX_SIZE (php-custom.ini): 2G = 2147483648 bytes.
      APACHE_BODY_LIMIT: ${APACHE_BODY_LIMIT:-2147483648}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1/status.php') ? 0 : 1);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - nextcloud-network
    deploy:
      replicas: ${APP_REPLICAS:-1}   # honored by Swarm; for Compose use --scale
      resources:
        limits:
          memory: ${APP_MEM_LIMIT:-3G}
          cpus: "${APP_CPUS_LIMIT:-2}"
        reservations:
          memory: ${APP_MEM_RES:-1G}
          cpus: "${APP_CPUS_RES:-1}"

  # ------------------------------------------------------------
  # 2. DEDICATED CRON CONTAINER (official /cron.sh -> busybox crond -f)
  # ------------------------------------------------------------
  nextcloud-cron:
    image: nextcloud:stable
    container_name: nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - nextcloud:/var/www/html
    networks:
      - nextcloud-network
    oom_score_adj: 500   # background job - never OOM-kill the app/Talk before it
    deploy:
      resources:
        limits:
          memory: ${CRON_MEM_LIMIT:-512M}
          cpus: "${CRON_CPUS_LIMIT:-1}"
        reservations:
          memory: ${CRON_MEM_RES:-256M}
          cpus: "${CRON_CPUS_RES:-0.5}"

  # ------------------------------------------------------------
  # 3. NEXTCLOUD TALK - optional; see readme.md
  #    Stock containers only (no AIO images):
  #    - signaling: standalone Talk signaling server
  #      https://github.com/strukturag/nextcloud-spreed-signaling
  #    - turn:      STUN/TURN relay for clients behind restrictive NATs
  #      https://github.com/processone/eturnal
  # ------------------------------------------------------------
  signaling:
    image: strukturag/nextcloud-spreed-signaling:2.1.1
    container_name: nextcloud-signaling
    restart: unless-stopped
    environment:
      # Internal HTTP listener - Caddy proxies /standalone-signaling here
      # (the frontend still sees only https://<NC_DOMAIN>/standalone-signaling).
      HTTP_LISTEN: 0.0.0.0:8081
      # Session keys - random hex strings (sizes in .env.example)
      HASH_KEY: ${HASH_KEY:?err}
      BLOCK_KEY: ${BLOCK_KEY:?err}
      # Shared secrets used to authenticate with the Nextcloud backend
      INTERNAL_SHARED_SECRET_KEY: ${INTERNAL_SECRET:?err}
      BACKENDS: backend1
      BACKEND_BACKEND1_URLS: https://${NC_DOMAIN:?err}
      BACKEND_BACKEND1_SHARED_SECRET: ${SIGNALING_SECRET:?err}
      # Only set to "true" for internal-only HTTP/TLS-less setups (see readme.md)
      SKIP_VERIFY: ${SKIP_VERIFY:-false}
    depends_on:
      - nextcloud-app
    networks:
      - nextcloud-network
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          memory: ${SIGNALING_MEM_LIMIT:-1G}
          cpus: "${SIGNALING_CPUS_LIMIT:-1}"
        reservations:
          memory: ${SIGNALING_MEM_RES:-512M}
          cpus: "${SIGNALING_CPUS_RES:-0.5}"

  turn:
    image: eturnal/eturnal:1.12.2
    container_name: nextcloud-turn
    restart: unless-stopped
    volumes:
      - ./config/eturnal.yml:/etc/eturnal.yml:ro
    user: "9000:9000"
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      # Shared TURN secret - must match `occ spreed:turn:add ... --secret=`
      ETURNAL_SECRET: ${TURN_SECRET:?err}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      # NOTE: the TURN relay UDP range (media relaying) is NOT published here.
      # A 16k-port bind (49152-65535) hangs/lags startup on Docker Desktop and
      # can take very long on Linux engines too. For real TURN media relaying,
      # apply the optional override (see SCALING.md / INSTALL.md):
      #     docker compose -f compose.yaml -f compose.turn.yaml up -d
      # compose.turn.yaml publishes a small configurable relay range.
    networks:
      - nextcloud-network
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          memory: ${TURN_MEM_LIMIT:-512M}
          cpus: "${TURN_CPUS_LIMIT:-1}"
        reservations:
          memory: ${TURN_MEM_RES:-256M}
          cpus: "${TURN_CPUS_RES:-0.5}"

  # ------------------------------------------------------------
  # 4. CADDY REVERSE PROXY (HTTP :80 only)
  # ------------------------------------------------------------
  caddy:
    image: caddy:alpine
    container_name: nextcloud-caddy
    restart: unless-stopped
    ports:
      - "80:80"   # Only port 80 (TLS is terminated by Tailscale Funnel upstream)
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - nextcloud-app
    networks:
      - nextcloud-network
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          memory: ${CADDY_MEM_LIMIT:-256M}
          cpus: "${CADDY_CPUS_LIMIT:-1}"
        reservations:
          memory: ${CADDY_MEM_RES:-128M}
          cpus: "${CADDY_CPUS_RES:-0.5}"

# ------------------------------------------------------------
networks:
  nextcloud-network:
    external: true
    name: nextcloud-network

volumes:
  nextcloud:
    name: nextcloud_www
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config
