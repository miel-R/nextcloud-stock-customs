name: nextcloud-aio
services:
  nextcloud-aio-database:
    image: postgres:16-alpine
    container_name: nextcloud-aio-database
    restart: unless-stopped
    volumes:
      - db:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextcloud} -d ${POSTGRES_DB:-nextcloud}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nextcloud-aio

  nextcloud-aio-redis:
    image: redis:alpine
    container_name: nextcloud-aio-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nextcloud-aio

  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - nextcloud-aio-nextcloud
    networks:
      - nextcloud-aio

  nextcloud-aio-nextcloud:
    image: nextcloud:stable
    container_name: nextcloud-aio-nextcloud
    restart: unless-stopped
    ports:
      - ${HTTP_PORT:-8080}:80
    volumes:
      - nextcloud:/var/www/html
    environment:
      POSTGRES_HOST: nextcloud-aio-database
      REDIS_HOST: nextcloud-aio-redis
      POSTGRES_DB: ${POSTGRES_DB:-nextcloud}
      POSTGRES_USER: ${POSTGRES_USER:-nextcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?set in .env}
      NEXTCLOUD_TRUSTED_DOMAINS: ${NEXTCLOUD_TRUSTED_DOMAINS:-localhost}
      OVERWRITECLIURL: ${OVERWRITECLIURL:-http://localhost:8080}
    depends_on:
      nextcloud-aio-database:
        condition: service_healthy
      nextcloud-aio-redis:
        condition: service_healthy
    networks:
      - nextcloud-aio

networks:
  nextcloud-aio:
    external: true
    name: nextcloud-aio

volumes:
  db:
  nextcloud:
  caddy_data:
  caddy_config:
